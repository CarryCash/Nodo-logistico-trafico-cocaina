name: Actualizar datos de comercio e incautaciones

on:
  schedule:
    # Corre todos los días a las 06:00 UTC (01:00 hora Ecuador)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write   # necesario para que el workflow pueda hacer commit y push

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests pandas

      - name: Descargar datos de UN Comtrade
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: python scripts/fetch_comtrade.py

      - name: Descargar datos de UNODC
        run: python scripts/fetch_unodc.py

      - name: Ejecutar análisis de correlación
        run: python scripts/analyze.py

      - name: Guardar cambios en el repositorio (commit automático)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Actualización automática de datos $(date -u +'%Y-%m-%d')"
          git push
